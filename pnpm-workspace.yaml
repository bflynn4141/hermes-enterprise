packages:
  - packages/*
  - apps/*

# The current Cloudflare Vitest pool pins an older sharp patch. Keep the pool,
# but force the patched ABI-compatible release until its next upstream cut.
overrides:
  sharp@0.35.2: 0.35.4

# esbuild and workerd ship prebuilt binaries and need their install scripts.
# The motion package uses Tailwind's one-shot compiler; its optional file
# watcher is not needed in CI and does not receive install-script permission.
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  workerd: true

# These three were published inside pnpm's default minimum release age window.
# They are the Cloudflare toolchain we deliberately pin; the pins are exact, so
# a fresh install resolves to the same bytes.
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260915.1'
  - miniflare@5.20260911.1-alpha
  - wrangler@4.131.2
  - framer-motion@13.3.0
  - motion-dom@13.3.0
  - motion-utils@13.3.0
  - motion@13.3.0
