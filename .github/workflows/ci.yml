name: CI

on:
  push:
    branches: [main]
  pull_request:

# The pipeline is part of the trust boundary: whoever can deploy can ship code
# that decrypts every tenant's provider key. So CI gets read-only permissions
# and never holds a deploy credential; the deploy job (M2) will live in a
# separate workflow with an environment reviewer.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches docker-compose.yml, so the same scripts work here and locally.
  PGHOST: 127.0.0.1
  PGPORT: '5433'
  PGDATABASE: hermes
  PGSUPERUSER: postgres
  PGSUPERPASSWORD: postgres
  PGLOCALPASSWORD: localdev

jobs:
  test:
    name: typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17.8-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hermes"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build the deployable application
        run: pnpm build

      - name: Apply pending migrations to the disposable CI database
        run: pnpm db:migrate

      - name: Verify migration replay in a disposable shadow database
        run: pnpm db:migrations:verify

      - name: Test
        run: pnpm test
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE_APP: postgres://app:localdev@127.0.0.1:5433/hermes
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE_AGENT: postgres://agent:localdev@127.0.0.1:5433/hermes

      - name: Grant assertion on its own
        # Also run separately, so a failure here is unambiguous in the log: this
        # is the check that the agent role cannot decide.
        # The GitHub service already owns port 5433, so call the focused Vitest
        # project directly instead of the local launcher that starts Compose.
        run: pnpm --filter @hermes/worker exec vitest run --project db test/db/grants.test.ts

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  actions:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # A workflow file is code that only ever runs in production. actionlint
      # catches the shell mistakes (`set -e` missing, an unquoted expansion) and
      # the schema mistakes (a job referring to a `needs` that does not exist)
      # that would otherwise be discovered by a failed deploy. It is installed
      # rather than pinned to an action so the version is visible here.
      #
      # A unit test (`test/unit/workflows.test.ts`) asserts the same files parse
      # and carry the properties this repository requires — a concurrency group
      # on every deploy, an environment on the production one, no secret in a
      # `run:` interpolation — because actionlint knows YAML and not us.
      - name: Install actionlint
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
      - name: Lint the workflows
        run: ./actionlint -color

  browser:
    name: mock client browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @hermes/client exec playwright install --with-deps chromium

      # This is intentionally named mock-client coverage: it proves browser
      # interaction against the in-process mock adapter, not the Worker,
      # Postgres, WorkOS or a model provider. It therefore needs no credential.
      - name: Run mock client browser tests
        run: pnpm test:browser:mock

      - name: Retain Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mock-client-${{ github.run_id }}
          path: |
            apps/client/playwright-report
            apps/client/test-results
          if-no-files-found: ignore
          retention-days: 14

  wrangler:
    name: wrangler dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the client assets
        run: pnpm --filter @hermes/client build

      # No credential is needed for a dry run, and none is provided. What this
      # proves is that both environments parse, that every binding resolves, and
      # that the bundle builds — which is the failure a deploy would otherwise
      # discover in production.
      - name: Dry run, staging
        run: pnpm --filter @hermes/worker exec wrangler deploy --dry-run --env staging

      - name: Dry run, production
        run: pnpm --filter @hermes/worker exec wrangler deploy --dry-run --env production
