name: Deploy staging

# On main, after CI succeeds. Staging is deployed automatically because a staging
# environment nobody deploys to is a staging environment that does not test
# anything; production needs a human (see deploy-production.yml).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# The pipeline is part of the BYOK trust boundary: whoever can deploy can ship
# code that decrypts every tenant's provider key. So this workflow gets the
# minimum, the API token is scoped to this Worker, and the job runs in a named
# GitHub Environment whose secrets are not readable from a pull request.
permissions:
  contents: read

# One deploy at a time, and never cancelled halfway: a cancelled `wrangler
# deploy` can leave the Worker and the migrations disagreeing about the schema,
# which is the one state expand/contract cannot save us from.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: migrate, build, deploy, smoke
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A workflow_run executes from the default branch. Pin checkout to
          # the exact commit whose CI run succeeded, not whatever main points
          # at by the time this runner starts.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Repeat the inexpensive trust-boundary checks at the exact commit being
      # deployed. The deploy is already gated on a successful main-branch CI,
      # and this catches a compromised or misconfigured deploy checkout too.
      - name: Exports parity, migration filenames, secret hygiene
        run: pnpm --filter @hermes/worker test:unit

      - name: Scan for secrets
        run: .github/scripts/gitleaks-scan.sh

      # Migrations run as `owner` against the target Neon branch, from here
      # rather than from the Worker: the Worker's two roles are deliberately
      # unable to change the schema, and the connection string that can is a
      # secret only this job holds.
      #
      # Expand/contract means this is safe to run before the deploy: the new
      # schema is compatible with the code currently running, so the window
      # between the two is not a broken window. It is also why a code rollback
      # never needs a reverse migration.
      - name: Check existing context access (read only)
        run: pnpm --filter @hermes/worker exec node scripts/context-access-preflight.mjs
        env:
          DATABASE_URL_OWNER: ${{ secrets.MIGRATIONS_DATABASE_URL }}
          CONTEXT_PREFLIGHT_WORKSPACE_ID: ${{ vars.CONTEXT_PREFLIGHT_WORKSPACE_ID }}

      - name: Apply migrations
        run: pnpm --filter @hermes/worker exec node scripts/migrate.mjs
        env:
          DATABASE_URL_OWNER: ${{ secrets.MIGRATIONS_DATABASE_URL }}

      - name: Build the client
        run: pnpm --filter @hermes/client build

      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/worker
          command: deploy --env staging

      # The smoke test is `/health`, because `/health` is the route that knows
      # which dependency is broken. A 200 means both Hyperdrive configs
      # answered as the right role, a Durable Object round-tripped, the
      # connection count is readable and (in workos mode) the JWKS is
      # reachable; a 503 body names the one that is not.
      - name: Smoke test /health
        env:
          URL: ${{ vars.STAGING_URL }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "health ok"
              cat /tmp/health.json
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            cat /tmp/health.json || true
            sleep 10
          done
          echo "staging did not become healthy"
          exit 1
